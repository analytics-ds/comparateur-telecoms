{{- $json := "" -}}
{{- with site.Home.OutputFormats.Get "json" }}{{ $json = .RelPermalink }}{{ end -}}
<div class="search" id="search"
     data-index="{{ $json }}"
     data-i18n-empty="{{ i18n "searchNoResults" }}"
     data-i18n-one="{{ i18n "searchOneResult" }}"
     data-i18n-many="{{ i18n "searchManyResults" }}"
     data-i18n-error="{{ i18n "searchError" }}"
     hidden>
  <div class="search-backdrop" data-search-close></div>
  <div class="search-panel" role="dialog" aria-modal="true" aria-label="{{ i18n "searchAria" }}">
    <form class="search-form" role="search" autocomplete="off" onsubmit="return false">
      <svg class="search-form-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <label class="sr-only" for="search-input">{{ i18n "searchLabel" }}</label>
      <input id="search-input" class="search-input" type="search" placeholder="{{ i18n "searchPlaceholder" }}" spellcheck="false">
      <button class="search-close" type="button" data-search-close aria-label="{{ i18n "searchClose" }}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </form>
    <p class="search-status" role="status" aria-live="polite"></p>
    <ul class="search-results" role="listbox" aria-label="{{ i18n "searchAria" }}"></ul>
    <div class="search-hint">
      <span>{{ i18n "searchHint" }}</span>
      <a href="{{ (cond (eq .Site.Language.Lang "fr") "plan-du-site/" "site-map/") | relLangURL }}">{{ i18n "sitemapLink" }}</a>
    </div>
  </div>
</div>
