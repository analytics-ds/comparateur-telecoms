<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">{{ i18n "skipToContent" }}</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ partial "search.html" . }}
  <button class="scroll-top" aria-label="{{ i18n "scrollTop" }}">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><polyline points="6 14 12 8 18 14"/></svg>
  </button>
  <script>
    (function(){
      // Menu mobile
      var t = document.querySelector('.nav-toggle'), n = document.querySelector('.main-nav');
      if (t && n) t.addEventListener('click', function(){ n.classList.toggle('open'); });
      // Bouton remonter
      var st = document.querySelector('.scroll-top');
      if (st) {
        document.addEventListener('scroll', function(){
          st.classList.toggle('visible', window.scrollY > 600);
        }, { passive: true });
        st.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); });
      }
    })();
  </script>
  <script src="{{ "js/search.js" | relURL }}" defer></script>
  {{ block "scripts" . }}{{ end }}
</body>
</html>
